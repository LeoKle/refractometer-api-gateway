apiVersion: v1
kind: Service
metadata:
  name: results-service
spec:
  type: NodePort
  selector:
    app: results-service
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30084
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: results-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: results-service
  template:
    metadata:
      labels:
        app: results-service
    spec:
      containers:
        - name: results-service
          image: ghcr.io/leokle/refractometer-backend-results-service:latest
          ports:
            - containerPort: 8000
          env:
            - name: MONGO_URI
              value: mongodb://mongo-results:27017
          resources:
            requests: { cpu: "1", memory: 1024Mi }
            limits: { cpu: "1", memory: 1024Mi }
