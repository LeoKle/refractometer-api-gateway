apiVersion: v1
kind: Service
metadata:
  name: mongo-${NAME}
spec:
  selector:
    app: mongo-${NAME}
  ports:
    - port: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo-${NAME}
spec:
  serviceName: mongo-${NAME}
  replicas: 1
  selector:
    matchLabels:
      app: mongo-${NAME}
  template:
    metadata:
      labels:
        app: mongo-${NAME}
    spec:
      containers:
        - name: mongo
          image: mongo:9.0.4
          args: ["--wiredTigerCacheSizeGB", "0.5"]
          ports:
            - containerPort: 27017
          resources:
            requests: { cpu: "1", memory: 1Gi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - name: data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
