apiVersion: v1
kind: Service
metadata:
  name: postgres-gateway
spec:
  type: NodePort
  selector:
    app: postgres-gateway
  ports:
    - port: 5432
      nodePort: 31000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-gateway
spec:
  serviceName: postgres-gateway
  replicas: 1
  selector:
    matchLabels:
      app: postgres-gateway
  template:
    metadata:
      labels:
        app: postgres-gateway
    spec:
      containers:
        - name: postgres
          image: postgres:18.4
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: refractometer
            - name: POSTGRES_DB
              value: refractometer-api-gateway
            - name: POSTGRES_PASSWORD
              valueFrom:
                {
                  secretKeyRef:
                    { name: api-gateway-secrets, key: POSTGRES_PASSWORD },
                }
          readinessProbe:
            exec:
              command:
                [
                  "pg_isready",
                  "-U",
                  "refractometer",
                  "-d",
                  "refractometer-api-gateway",
                ]
            periodSeconds: 5
          resources:
            requests: { cpu: "1", memory: 1Gi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
