apiVersion: v1
kind: Service
metadata:
  name: redis-gateway
spec:
  type: NodePort
  selector:
    app: redis-gateway
  ports:
    - port: 6379
      nodePort: 31001

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-gateway
spec:
  serviceName: redis-gateway
  replicas: 1
  selector:
    matchLabels:
      app: redis-gateway
  template:
    metadata:
      labels:
        app: redis-gateway
    spec:
      containers:
        - name: redis
          image: redis:8.12-rc3-trixie
          ports:
            - containerPort: 6379
          resources:
            requests: { cpu: "500m", memory: 512Mi }
            limits: { cpu: "500m", memory: 512Mi }
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
