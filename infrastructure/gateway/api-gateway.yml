apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      initContainers:
        # Applies the alembic migrations (users table) before the gateway starts.
        - name: migrate
          image: ghcr.io/leokle/refractometer-api-gateway:latest
          imagePullPolicy: Always
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: api-gateway-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                {
                  secretKeyRef:
                    { name: api-gateway-secrets, key: POSTGRES_PASSWORD },
                }
            - name: DB_URL
              value: postgresql+psycopg2://refractometer:$(POSTGRES_PASSWORD)@postgres-gateway:5432/refractometer-api-gateway
            - name: JWT_PRIVATE_KEY
              valueFrom:
                {
                  secretKeyRef:
                    { name: api-gateway-secrets, key: JWT_PRIVATE_KEY },
                }
            - name: JWT_PUBLIC_KEY
              valueFrom:
                {
                  secretKeyRef:
                    { name: api-gateway-secrets, key: JWT_PUBLIC_KEY },
                }
            - name: OAUTH_CLIENT_ID
              valueFrom:
                {
                  secretKeyRef:
                    { name: api-gateway-secrets, key: OAUTH_CLIENT_ID },
                }
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                {
                  secretKeyRef:
                    { name: api-gateway-secrets, key: OAUTH_CLIENT_SECRET },
                }
      containers:
        - name: api-gateway
          image: ghcr.io/leokle/refractometer-api-gateway:latest
          command: ["uvicorn"]
          args:
            - api.app:app
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --app-dir
            - src
            - --workers
            - "4"
            - --loop
            - "uvloop"
            - --http
            - "httptools"
            - --no-access-log
            - --log-level
            - "warning"
            - --backlog
            - "4096"
            - --timeout-keep-alive
            - "30"
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: api-gateway-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                {
                  secretKeyRef:
                    { name: api-gateway-secrets, key: POSTGRES_PASSWORD },
                }
            - name: DB_URL
              value: postgresql+psycopg2://refractometer:$(POSTGRES_PASSWORD)@postgres-gateway:5432/refractometer-api-gateway
            - name: JWT_PRIVATE_KEY
              valueFrom:
                {
                  secretKeyRef:
                    { name: api-gateway-secrets, key: JWT_PRIVATE_KEY },
                }
            - name: JWT_PUBLIC_KEY
              valueFrom:
                {
                  secretKeyRef:
                    { name: api-gateway-secrets, key: JWT_PUBLIC_KEY },
                }
            - name: OAUTH_CLIENT_ID
              valueFrom:
                {
                  secretKeyRef:
                    { name: api-gateway-secrets, key: OAUTH_CLIENT_ID },
                }
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                {
                  secretKeyRef:
                    { name: api-gateway-secrets, key: OAUTH_CLIENT_SECRET },
                }
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          resources:
            requests: { cpu: "1", memory: 1024Mi }
            limits: { cpu: "1", memory: 1024Mi }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
data:
  ENV: prod
  DB_ECHO: "false"

  REDIS_URL: redis://redis-gateway:6379/0

  JWT_ALGORITHM: EdDSA
  JWT_ISSUER: refractometer-api-gateway
  JWT_AUDIENCE: refractometer-backend

  OAUTH_URL: https://github.com/login
  OAUTH_REDIRECT_URL: "https://192.168.178.240/api/v1/auth/callback"
  OAUTH_SCOPES: "read:user user:email"

  SPECTRUM_CLIENT_URL: http://parameter-service
  SPECTRUM_CLIENT_MAX_CONNECTIONS: "100"
  SPECTRUM_CLIENT_MAX_KEEPALIVE_CONNECTIONS: "100"
  SAMPLE_CLIENT_URL: http://parameter-service
  SAMPLE_CLIENT_MAX_CONNECTIONS: "100"
  SAMPLE_CLIENT_MAX_KEEPALIVE_CONNECTIONS: "100"

  IMAGE_CLIENT_URL: http://image-service
  RESULT_CLIENT_URL: http://results-service
  QUEUE_CLIENT_URL: http://queue-service
