apiVersion: v1
kind: Service
metadata:
  name: image-service
spec:
  type: NodePort
  selector:
    app: image-service
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: image-service
  template:
    metadata:
      labels:
        app: image-service
    spec:
      containers:
        - name: image-service
          image: ghcr.io/leokle/refractometer-backend-image-service:latest
          command: ["uvicorn"]
          args:
            - api.app:app
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --app-dir
            - src
            # - --workers
            # - "4"
            - --loop
            - "uvloop"
            - --http
            - "httptools"
            - --no-access-log
            - --log-level
            - "warning"
            - --backlog
            - "4096"
          ports:
            - containerPort: 8000
          env:
            - name: MONGO_URI
              value: mongodb://mongo-image:27017
            - name: LOGURU_LEVEL
              value: WARNING
          resources:
            requests: { cpu: "1", memory: 1024Mi }
            limits: { cpu: "1", memory: 1024Mi }
