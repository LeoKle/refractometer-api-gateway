apiVersion: v1
kind: Service
metadata:
  name: monolith
spec:
  type: NodePort
  selector:
    app: monolith
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30085
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monolith
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monolith
  template:
    metadata:
      labels:
        app: monolith
    spec:
      containers:
        - name: monolith
          image: ghcr.io/leokle/refractometer-backend-monolith:latest
          ports:
            - containerPort: 8000
          env:
            - name: USE_MOCK_SIMULATION
              value: "True"
            - name: IMAGE_SERVICE_URL
              value: http://image-service
            - name: QUEUE_SERVICE_URL
              value: http://queue-service
            - name: SIM_RESULT_SERVICE_URL
              value: http://results-service
          resources:
            requests: { cpu: "1", memory: 1024Mi }
            limits: { cpu: "1", memory: 1024Mi }
