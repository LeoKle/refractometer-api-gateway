# mkcert -cert-file refractometer.pem -key-file refractometer-key.pem <server-ip> localhost 127.0.0.1
# kubectl create secret tls refractometer-tls --cert=refractometer.pem --key=refractometer-key.pem
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
spec:
  defaultCertificate:
    secretName: refractometer-tls
---
# redirect plain HTTP (port 80) to HTTPS (port 443)
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: refractometer-http-redirect
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    # format: <namespace>-<middleware name>@kubernetescrd
    traefik.ingress.kubernetes.io/router.middlewares: default-redirect-https@kubernetescrd
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
