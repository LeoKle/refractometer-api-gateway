name: Refractometer API Gateway CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write
  packages: write

env:
  DIRECTORY: .
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Setup backend
        uses: ./.github/actions/setup

      - name: Run ruff format
        run: cd ${{ env.DIRECTORY }} && uv run ruff format --diff

  check:
    needs: format
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        
      - name: Setup backend
        uses: ./.github/actions/setup
        with:
          directory: ${{ env.DIRECTORY }}

      - name: Run ruff check
        run: cd ${{ env.DIRECTORY }} && uv run ruff check --output-format github
      # - name: Run pyright
      #   run: uv run pyright


  tests:
    needs: check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Setup service
        uses: ./.github/actions/setup
        with:
          directory: ${{ env.DIRECTORY }}

      - name: Run unit tests
        uses: ./.github/actions/pytest
        with:
          directory: ${{ env.DIRECTORY }}
          test_type: unit

      - name: Run integration tests
        uses: ./.github/actions/pytest
        with:
          directory: ${{ env.DIRECTORY }}
          test_type: integration

    #   - name: Setup contract tests
    #     working-directory: ${{ env.DIRECTORY }}
    #     run: docker compose -f docker-compose.pact.yml up -d
    #     shell: bash
        
    #   - name: Run contract tests
    #     uses: ./.github/actions/pytest
    #     with:
    #       directory: ${{ env.DIRECTORY }}
    #       test_type: pact
    #     env:
    #       ENABLE_PACT_STATES: true

    #   - name: Teardown contract tests
    #     if: always()
    #     working-directory: ${{ env.DIRECTORY }}
    #     run: docker compose -f docker-compose.pact.yml down
    #     shell: bash

      - name: Report coverage to OctoCov
        uses: k1LoW/octocov-action@v1
        with:
          work-dir: ${{ env.DIRECTORY }}
        continue-on-error: true

  build-and-push:
    needs: tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./${{ env.DIRECTORY }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  